# =============================================================
# NAV2 PARAMS  -  Ex86130 PRO RUNNER (Ackermann, no reverse)
# -------------------------------------------------------------
# Arac  : 0.512 x 0.240 m,  wheelbase 0.313 m,  max steer 46 deg
# R_min : L / tan(46)  =  0.302 m  -> guvenli 0.40 m
# w_max : v * tan(46) / L  ~  5.30 rad/s @ 1.6 m/s  -> 5.0
# Sensor: IMU + GNSS 20Hz  (encoder yok)
# Drive : ileri + geri (max -0.5 m/s), yerinde donme yok
# =============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 100
    # 20 ms (varsayilan) yuklu Pi icin cok sikiydi: controller follow_path
    # goal'unu 20 ms'de acknowledge edemeyince bt_navigator "Timed out while
    # waiting for action server to acknowledge" deyip abort ediyordu. 1000 ms
    # ust sinir (normalde ack hizli; sadece spike'larda bekler).
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    # Ackermann: spin/backup recovery YOK -> recovery'siz kendi BT'lerimiz
    default_nav_to_pose_bt_xml: "/root/ros2_ws/src/rover_bringup/config/navigate_to_pose_no_recovery.xml"
    default_nav_through_poses_bt_xml: "/root/ros2_ws/src/rover_bringup/config/my_nav_through_poses_bt.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

bt_navigator_navigate_to_pose:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses:
  ros__parameters:
    use_sim_time: false

# =============================================================
# CONTROLLER  (Regulated Pure Pursuit, forward-only, no in-place)
# =============================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    # Pi 20 Hz'i yetistiremiyordu ("Control loop missed 20 Hz") -> komutlar
    # kesik gidip arac takiliyordu. 10 Hz Pi'de stabil calisir.
    controller_frequency: 10.0
    odom_topic: /odometry/local

    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.005
    min_theta_velocity_threshold: 0.005
    failure_tolerance: 5.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    current_goal_checker: "goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14        # yon umurumuzda degil

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 1.6
      # Fiziksel limit: 1.6 * tan(46)/0.313 ~ 5.3; guvenli 5.0
      # (1.6 m/s'de cap'i 2.5'te birakirsak controller virajda
      #  acisal limite takilip lineer hizi dusurur -> orantili yukseltildi)
      max_angular_vel: 5.0
      min_approach_linear_velocity: 0.3
      approach_velocity_scaling_dist: 1.0

      # Lookahead orta nokta: 1.5m cok kucuktu -> duzde slalom yapiyordu
      # (GPS/IMU heading gurultusu + kisa lookahead = savrulma). 1.0m taban
      # slalomu sonduruyor. Hiz olceklemeli: lookahead = clamp(v*time, min, max).
      #   1.6 m/s düz: ~2.4m ;  0.5 m/s viraj: min'e (1.0) duser.
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      lookahead_dist: 1.0
      min_lookahead_dist: 1.0
      max_lookahead_dist: 3.0

      # ---- Ackermann: yerinde donme YOK ----
      use_rotate_to_heading: false

      # Virajlarda hiz regulasyonu
      # min_radius: bu yariciptan kucuk donuslerde regulasyon devreye girer.
      #   0.4 (R_min) cok kucuktu -> sadece en keskin koselerde yavasliyordu,
      #   araba kosye hizli girip tasiyor ve sikisiyordu. 0.9'a cikarildi ki
      #   kosye yaklasirken erken ve yumusak yavaslasin.
      # min_speed: virajda hizin dusebilecegi taban. 0.8 cok hizliydi (donus
      #   yaricapina giremiyordu) -> 0.5. Crawl etmeden kosye doner.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.5

      # Geri vites ACIK: keskin koselerde (NavFn ~90 derece bend uretiyor)
      # ileri-only Ackermann donemiyor, apex'i tasiyip sikisiyor. Geri vites
      # repozisyona izin verir. Asil cozum: feasible planner (Smac Hybrid).
      allow_reversing: true

      transform_tolerance: 1.0
      # max_angular_accel: yeni yaw cap'i (5.0) icin orantili yukseltildi
      max_angular_accel: 20.0

# =============================================================
# PLANNER  (NavFn - Pi'yi yormamak icin SmacHybrid yerine geri alindi)
# =============================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    # BT zaten 0.333 Hz'de (3 sn) replan istiyor; Pi'de NavFn tum haritada
    # ~1.5 sn suruyor. 1.0 esigi surekli spurious uyari basiyordu -> 0.5.
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 2.0
      use_astar: false
      allow_unknown: true

# =============================================================
# SMOOTHER
# =============================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# =============================================================
# COSTMAPS  (footprint = 0.512 x 0.240 m, kucuk pay ile)
# =============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.5
      track_unknown_space: false
      rolling_window: false
      always_send_full_costmap: true

      # 0.55 x 0.30 : tekerlek dis kenari (iz 0.26 + tekerlek geni 0.04)
      # = ±0.15 -> tekerlekleri de kapsar (govde 0.24'ten genis)
      footprint: "[[0.275, 0.15], [0.275, -0.15], [-0.275, -0.15], [-0.275, 0.15]]"

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # KRITIK: global_frame=odom DEGIL, map.
      # Local EKF (ekf_filter_node_odom) konum uretmiyor (encoder/ivme yok),
      # odom->base_link TF'i hep (0,0)'da donuk; tum hareket map->odom'da.
      # odom secersek controller'in progress checker'i robotu hep (0,0)'da
      # sanip 24m gitse bile 30 sn'de "Failed to make progress" der.
      # map (RTK pürüzsüz) -> robotun gercek hareketi gorunur.
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.5
      track_unknown_space: false
      always_send_full_costmap: true

      footprint: "[[0.275, 0.15], [0.275, -0.15], [-0.275, -0.15], [-0.275, 0.15]]"

      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 3.0

# =============================================================
# BEHAVIORS  (sadece wait;  spin / backup YOK)
# =============================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    behavior_plugins: ["wait"]

    wait:
      plugin: "nav2_behaviors/Wait"

# =============================================================
# WAYPOINT FOLLOWER
# =============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

# =============================================================
# VELOCITY SMOOTHER
# =============================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    odom_topic: /odometry/local
    odom_duration: 0.2

    # [vx, vy, vyaw]
    # ileri: 1.8 (desired 1.6 + ~%10 pay)  /  geri: -0.5 (daha yavas, guvenli)
    # vyaw: ±5.0  (1.6 m/s'de fiziksel ackermann limiti)
    max_velocity: [1.8, 0.0, 5.0]
    min_velocity: [-0.5, 0.0, -5.0]

    # accel: hedef hize daha cabuk ulasmak icin yukseltildi
    max_accel: [1.5, 0.0, 8.0]
    max_decel: [-2.0, 0.0, -8.0]

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 2.0

# =============================================================
# LIFECYCLE
# =============================================================
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
