ekf_filter_node_map:
  ros__parameters:
    # ============================================================
    # GLOBAL EKF  (map frame)
    # ------------------------------------------------------------
    # Inputs:
    #   IMU (BNO055)          : sadece vyaw      ~30 Hz (GPS arasi yon yumusatma)
    #   GPS Position (navsat) : x, y             20 Hz  (/odometry/gps)
    #   GPS Heading           : mutlak yaw        ~ GNSS hizinda  (/gps/imu)
    # NOT: ivme (ax) FUZE EDILMEZ -> cift integral konumu kacirir.
    #       Konum tamamen GPS'ten gelir.
    # Cikti: /odometry/global   + map -> odom TF
    # ============================================================

    frequency: 30.0
    sensor_timeout: 0.15           # 20Hz GNSS -> 50ms; 150ms guvenli
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map               # global filtre: map -> odom yayinlar

    publish_tf: true
    publish_acceleration: false

    # ============================================================
    # IMU 0 : BNO055 gyro (sadece vyaw - GPS arasi yon yumusatma)
    # ============================================================
    imu0: /bno055/imu
    imu0_queue_size: 10
    imu0_nodelay: true

    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]   # ax KAPALI -> konum kacmaz

    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false  # ivme fuze edilmiyor

    # ============================================================
    # ODOM 0 : navsat_transform_node -> /odometry/gps  (20 Hz)
    # Sadece X, Y konum
    # ============================================================
    odom0: /odometry/gps
    odom0_queue_size: 10
    odom0_nodelay: true

    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    odom0_differential: false
    odom0_relative: false

    # ============================================================
    # IMU 1 : Dual antenna GNSS heading (mutlak yaw)
    # ============================================================
    imu1: /gps/imu
    imu1_queue_size: 10
    imu1_nodelay: true

    imu1_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]

    imu1_differential: false
    imu1_relative: false           # harita kuzeyiyle hizalanir

    use_control: false
