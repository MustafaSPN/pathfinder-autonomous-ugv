ekf_filter_node_odom:
  ros__parameters:
    # --- TEMEL AYARLAR ---
    frequency: 30.0
    sensor_timeout: 0.2     # 12Hz Odom (0.08s) için 0.1 çok riskli, 0.2 yaptık.
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    debug: false

    # --- FRAME AYARLARI ---
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom       # Yerel filtre olduğu için world = odom

    publish_tf: true
    publish_acceleration: false

    # =============== INPUT 1: ESP WHEEL ODOM (12 Hz) ===============
    odom0: /odom_esp
    odom0_queue_size: 2
    odom0_nodelay: false
    
    # Sadece Vx (İleri Hız) ve Vyaw (Dönüş Hızı - Yedek)
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true, false,
                   false, false, false,
                   false, false, false]

    odom0_differential: false
    odom0_relative: false

    # =============== INPUT 2: BNO055 IMU (27 Hz) ===============
    # Dönüşler (Yaw) ve Dönüş Hızı (Vyaw) buradan alınacak (Daha hızlı ve doğru)
    imu0: /bno055/imu
    imu0_queue_size: 5
    imu0_nodelay: true      # IMU hızlı, gecikme istemiyoruz
    
    imu0_config: [false, false, false,
                  false, false, false,   # Yaw (Yön)
                  false, false, false,
                  false, false, true,   # Vyaw (Jiroskop Hızı)
                  false, false, false]

    imu0_differential: false
    
    # KRİTİK AYAR: RELATIVE = TRUE
    # Yerel filtrede robot açıldığında burnu nereye bakarsa baksın "0" derece kabul etmeli.
    # Bu sayede GPS kuzeyi ile karışmaz ve pürüzsüz sürüş sağlar.
    imu0_relative: true 
    
    imu0_remove_gravitational_acceleration: false
    
    use_control: false